services:
  postgres:
    image: postgres:16-alpine
    container_name: financeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: ${POSTGRES_DB:-financeai}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeai} -d ${POSTGRES_DB:-financeai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - financeai-net

  redis:
    image: redis:7-alpine
    container_name: financeai-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - financeai-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: financeai-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./apps/api:/app
    networks:
      - financeai-net

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: financeai-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    networks:
      - financeai-net

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: financeai-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    networks:
      - financeai-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: financeai-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - financeai-net

  nginx:
    image: nginx:1.27-alpine
    container_name: financeai-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - financeai-net

networks:
  financeai-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
